name: Stage No.18 exact release assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/NO18_STAGE_ASSETS"

permissions:
  contents: write

jobs:
  stage-assets:
    runs-on: ubuntu-latest
    container: debian:13.3
    steps:
      - name: Install pinned-compatible build dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            python3 \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            lmodern

      - name: Check out release candidate
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: bash
        run: |
          python3 --version
          pdflatex --version | head -2
          cat /etc/os-release

      - name: Verify source and metadata hashes before generation
        shell: bash
        run: |
          grep -E '  (Yonezu_2026_No18_Third_Diagonal\.tex|NO18_THIRD_DIAGONAL_VERIFY_V3\.py|VERIFICATION_OUTPUT\.txt|README\.md|CITATION\.cff|RELEASE_NOTES_v1\.0\.0\.md)$' SHA256SUMS.txt \
            | sha256sum -c -

      - name: Re-run complete audit and reproduce full JSON
        shell: bash
        run: |
          python3 NO18_THIRD_DIAGONAL_VERIFY_V3.py --json NO18_AUDIT_FULL.json | tee /tmp/no18_verify.txt
          grep -q '"failures": 0' /tmp/no18_verify.txt
          grep -q '"all_pass": true' /tmp/no18_verify.txt

      - name: Rebuild exact paper PDF
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "1790085699"
          FORCE_SOURCE_DATE: "1"
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error Yonezu_2026_No18_Third_Diagonal.tex
          pdflatex -interaction=nonstopmode -halt-on-error Yonezu_2026_No18_Third_Diagonal.tex

      - name: Verify complete release manifest
        shell: bash
        run: |
          sha256sum -c SHA256SUMS.txt

      - name: Commit exact generated assets
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Yonezu_2026_No18_Third_Diagonal.pdf NO18_AUDIT_FULL.json
          if git diff --cached --quiet; then
            echo "Exact generated assets already present."
            exit 0
          fi
          git commit -m "Add exact No.18 PDF and full audit"
          git push
